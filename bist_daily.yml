name: BIST Adaptive ML Daily Paper

on:
  schedule:
    - cron: '27 18 * * 1-5'
      timezone: 'Europe/Istanbul'
    - cron: '7 19 * * 1-5'
      timezone: 'Europe/Istanbul'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Çalışma modu'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - primary

permissions:
  contents: write

concurrency:
  group: bist-adaptive-paper
  cancel-in-progress: false

jobs:
  run-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -q

      - name: Run adaptive paper
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE="primary"
          else
            MODE="${{ inputs.mode }}"
          fi
          echo "run_mode=$MODE" >> "$GITHUB_ENV"
          python main.py --mode "$MODE"

      - name: Job summary
        if: always()
        shell: bash
        run: |
          if [ -f output/latest_report.md ]; then
            cat output/latest_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit PRIMARY state
        if: success() && env.run_mode == 'primary'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state data output/latest_report.md
          if git diff --cached --quiet; then
            echo "State değişmedi; commit yok."
            exit 0
          fi
          git commit -m "paper: günlük BIST state $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
